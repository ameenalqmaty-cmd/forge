# Builds the Android APK ON DEMAND only (not on every push — previews are the web build).
# Triggers: Forge Studio's "تثبيت مباشر" button / "Run workflow" in Actions (workflow_dispatch),
# or pushing a version tag like v1.2.0. Publishes a GitHub Release with the .apk.
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Phone notifications (Firebase file prepared by Forge)
        run: |
          if [ -f .forge/google-services.json ]; then
            npm i --no-audit --no-fund @capacitor/push-notifications@^8
            echo "VITE_FORGE_PUSH_ANDROID=1" >> "$GITHUB_ENV"
          else
            echo "No .forge/google-services.json — this APK has no phone notifications (messages still show inside the app)"
          fi

      - name: In-app updates (live updates + APK download inside the app)
        run: |
          N=$(node scripts/forge-native.mjs)   # before adding plugins (they are excluded anyway)
          npm i --no-audit --no-fund @capgo/capacitor-updater@^8 @capacitor/filesystem@^8 @capawesome-team/capacitor-file-opener@^8
          V=$(date -u +%Y%m%d%H%M%S)
          { echo "VITE_FORGE_NATIVE=$N"; echo "VITE_FORGE_WEB_VERSION=$V"; echo "VITE_FORGE_APK_VERSION=$V"; echo "APK_VERSION=$V"; } >> "$GITHUB_ENV"
          [ -f .forge/cloud.json ] && echo "VITE_FORGE_UPDATER=1" >> "$GITHUB_ENV" || true
          echo "native $N · version $V"

      - name: Build web app (connected to Forge Cloud — data, stats, pause, lock)
        run: |
          if [ -f .forge/cloud.json ]; then
            export VITE_FORGE_CLOUD_URL="$(jq -r '.url // empty' .forge/cloud.json)"
            export VITE_FORGE_CLOUD_KEY="$(jq -r '.key // empty' .forge/cloud.json)"
            export VITE_FORGE_APP_ID="$(jq -r '.app // empty' .forge/cloud.json)"
          else
            echo "::warning::No .forge/cloud.json — this APK works on the device only (no Forge Cloud, cannot be paused from Studio)"
          fi
          npm run build

      - name: Prepare Android project
        run: |
          [ -d android ] || npx cap add android
          [ -f .forge/google-services.json ] && cp .forge/google-services.json android/app/google-services.json || true
          # the app may hand a downloaded update to Android's installer
          M=android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' "$M"
          npm run assets
          npx cap sync android

      - name: Set version (versionCode only goes up)
        run: |
          VERSION=$(jq -r '.version // "1.0.0"' forge.config.json)
          # always higher than any earlier build: minutes since 2024 (+ versionCodeBase for apps imported with a higher old code)
          CODE=$(( ($(date -u +%s) - 1704067200) / 60 + $(jq -r '.versionCodeBase // 0' forge.config.json) ))
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP=$(jq -r '.appId | split(".") | last' forge.config.json)" >> "$GITHUB_ENV"

      - name: Use the fixed debug key (updates install over previous builds)
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          # an app with its own key (e.g. imported from an earlier build) signs the installable APK with it, so phones update in place
          if [ "$HAS_KEY" = "true" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > own.keystore
            ./gradlew assembleDebug --no-daemon -q -Pandroid.injected.signing.store.file=$PWD/own.keystore \
              -Pandroid.injected.signing.store.password='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
              -Pandroid.injected.signing.key.alias='${{ secrets.ANDROID_KEY_ALIAS }}' \
              -Pandroid.injected.signing.key.password='${{ secrets.ANDROID_KEY_PASSWORD }}'
          else
            ./gradlew assembleDebug --no-daemon -q
          fi

      - name: Release build (only if a release key is configured)
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          SIGN="-Pandroid.injected.signing.store.file=$PWD/release.keystore -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}"
          ./gradlew assembleRelease bundleRelease --no-daemon -q $SIGN

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${APP}-${VERSION}-build${{ github.run_number }}.apk"
          [ -f android/app/build/outputs/apk/release/app-release.apk ] && cp android/app/build/outputs/apk/release/app-release.apk "out/${APP}-${VERSION}-release.apk" || true
          [ -f android/app/build/outputs/bundle/release/app-release.aab ] && cp android/app/build/outputs/bundle/release/app-release.aab "out/${APP}-${VERSION}-play.aab" || true
          ls -la out

      - name: Publish the APK for in-app updates (Forge Cloud)
        env:
          RELEASE_KEY: ${{ secrets.FORGE_RELEASE_KEY }}
        continue-on-error: true
        run: |
          if [ -z "$RELEASE_KEY" ] || [ ! -f .forge/cloud.json ]; then echo "In-app updates not set up for this app yet (Studio prepares it on the next build)"; exit 0; fi
          URL=$(jq -r .url .forge/cloud.json); ANON=$(jq -r .key .forge/cloud.json); APPID=$(jq -r .app .forge/cloud.json)
          NOTES=$(git log -1 --pretty=%s | head -c 200 | jq -sRr @uri)
          CODE=$(curl -s -o /tmp/rel.json -w '%{http_code}' -X POST \
            "$URL/functions/v1/forge-release?action=apk&app=$APPID&version=$APK_VERSION&native=$VITE_FORGE_NATIVE&notes=$NOTES" \
            -H "apikey: $ANON" -H "x-forge-release: $RELEASE_KEY" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @android/app/build/outputs/apk/debug/app-debug.apk)
          echo "HTTP $CODE: $(cat /tmp/rel.json)"

      - uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.run_number }}
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ env.APP }} ${{ env.VERSION }} — build ${{ github.run_number }}"
          body: "Commit: ${{ github.sha }}\n\n${{ github.event.head_commit.message }}"
          files: out/*
          make_latest: true
